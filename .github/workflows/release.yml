name: Release

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "TAG=v${VERSION}" >> "$GITHUB_ENV"

      - name: Ensure release tag is new
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists. Bump package.json version before releasing (merging to release without a bump re-publishes the old tag)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: npm run build

      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Build admin API
        working-directory: api
        run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o meet-and-talk-api ./cmd/server

      - name: Package release bundle
        run: |
          BUNDLE_DIR="meet-and-talk-${TAG}"

          chmod +x scripts/package-release.sh
          scripts/package-release.sh "${BUNDLE_DIR}"

          cd "${BUNDLE_DIR}"
          zip -r "../meet-and-talk-${TAG}.zip" .
          cd ..
          cp "meet-and-talk-${TAG}.zip" meet-and-talk.zip

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          files: |
            meet-and-talk-${{ env.TAG }}.zip
            meet-and-talk.zip
          make_latest: true
          generate_release_notes: true
